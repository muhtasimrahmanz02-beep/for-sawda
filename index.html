<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        /* Background image with white flowers */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: brightness(0.8); /* Makes the text easier to read */
            z-index: -1;
        }

        /* The moving text container */
        .scrolling-container {
            position: absolute;
            top: 50%;
            white-space: nowrap;
            width: 100%;
        }

        /* The actual "Oiiiiiiiiiiii Sawdaaaa" text */
        .moving-text {
            display: inline-block;
            font-size: 80px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            animation: moveRightToLeft 8s linear infinite;
        }

        /* Animation logic */
        @keyframes moveRightToLeft {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="scrolling-container">
        <div class="moving-text">Oiiiiiiiiiiii Sawdaaaaa<br>Meow Meow</div>
    </div>

</body>
</html>
